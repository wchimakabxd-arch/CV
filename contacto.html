<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tu CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header class="text-center">
    <h1>Contacto</h1>
    <nav>
        <a href="./index.html">Inicio</a>
        <a href="./experiencia.html">Experiencia</a>
        <a href="./estudios.html">Estudios</a>
        <a href="./contacto.html">Contacto</a>
    </nav>
</header>

<div class="container mt-4">

<div class="card bg-dark text-white p-4 shadow">

    <h2 class="text-danger">Contacto</h2>

    <p><strong>Email:</strong> wchimakabxd@gmail.com</p>
    <p><strong>Teléfono:</strong> 3052162144</p>

    <hr class="border-danger">

    <!-- BOTÓN DIRECTO -->
    <h3>Contacto rápido</h3>
    <a href="mailto:wchimakabxd@gmail.com" class="btn btn-danger mb-3">
        Enviar correo directo
    </a>

    <hr class="border-danger">

    <!-- FORMULARIO -->
    <h3>Enviar mensaje</h3>

    <form id="formulario">

        <div class="mb-3">
            <input type="text" id="nombre" class="form-control" placeholder="Tu nombre">
        </div>

        <div class="mb-3">
            <input type="email" id="correo" class="form-control" placeholder="Tu correo">
        </div>

        <div class="mb-3">
            <textarea id="mensaje" class="form-control" placeholder="Escribe tu mensaje"></textarea>
        </div>

        <button type="submit" class="btn btn-danger">Enviar mensaje</button>

    </form>

    <!-- MENSAJE -->
    <p id="mensajeError" class="mt-3"></p>

</div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- VALIDACIÓN + ANIMACIÓN -->
<script>
$(document).ready(function(){

    // Animación
    $(".card").hide().fadeIn(1000);

    // Validación
    $("#formulario").submit(function(e){
        e.preventDefault();

        let nombre = $("#nombre").val().trim();
        let correo = $("#correo").val().trim();
        let mensaje = $("#mensaje").val().trim();

        if(nombre === "" || correo === "" || mensaje === ""){
            $("#mensajeError").css("color","red");
            $("#mensajeError").text("⚠ Todos los campos son obligatorios");
        }
        else if(!correo.includes("@")){
            $("#mensajeError").css("color","red");
            $("#mensajeError").text("⚠ Ingresa un correo válido");
        }
        else{
            $("#mensajeError").css("color","lime");
            $("#mensajeError").text("✅ Mensaje enviado correctamente");
        }
    });

});
</script>

</body>
</html>
