<!-- CONTENIDO -->
<div class="container mt-4">
<div class="card p-4 text-white">

<h2 class="text-danger">Contacto</h2>

<!-- INFO DE CONTACTO (ARREGLADO) -->
<div class="mb-3">
    <p class="mb-1"><strong>Email:</strong></p>

<!-- FORMULARIO -->
<form id="formulario">

<div class="mb-3">
<input type="text" id="nombre" class="form-control" placeholder="Nombre">
</div>

<div class="mb-3">
<input type="email" id="correo" class="form-control" placeholder="Correo">
</div>

<div class="mb-3">
<textarea id="mensaje" class="form-control" placeholder="Mensaje"></textarea>
</div>

<button type="submit" class="btn btn-danger w-100">Enviar mensaje</button>

</form>

<p id="mensajeError" class="mt-3"></p>

</div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function(){

    $(".card").hide().fadeIn(1000);

    $("#formulario").submit(function(e){
        e.preventDefault();

        let nombre = $("#nombre").val().trim();
        let correo = $("#correo").val().trim();
        let mensaje = $("#mensaje").val().trim();

        if(nombre === "" || correo === "" || mensaje === ""){
            $("#mensajeError").text("⚠ Completa todos los campos").css("color","red");
        } 
        else if(!correo.includes("@")){
            $("#mensajeError").text("⚠ Correo inválido").css("color","red");
        } 
        else{
            alert("✅ Mensaje enviado correctamente");
            $("#mensajeError").text("Mensaje enviado correctamente ✔").css("color","lime");
            $("#formulario")[0].reset();
        }

    });

});
</script>
