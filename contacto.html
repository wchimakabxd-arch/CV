<body>

<div class="container mt-4">
<div class="card p-4 text-white">

<h2>Contacto</h2>

<a href="mailto:wchimakabxd@gmail.com" class="btn btn-danger mb-3">
Enviar correo directo
</a>

<form id="formulario">

<input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre">
<input type="email" id="correo" class="form-control mb-2" placeholder="Correo">
<textarea id="mensaje" class="form-control mb-2" placeholder="Mensaje"></textarea>

<button class="btn btn-danger">Enviar</button>

</form>

<p id="mensajeError"></p>

</div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$("#formulario").submit(function(e){
e.preventDefault();

let nombre=$("#nombre").val();
let correo=$("#correo").val();
let mensaje=$("#mensaje").val();

if(nombre==""||correo==""||mensaje==""){
$("#mensajeError").text("Completa todos los campos").css("color","red");
}else if(!correo.includes("@")){
$("#mensajeError").text("Correo inválido").css("color","red");
}else{
alert("Mensaje enviado correctamente");
$("#mensajeError").text("Enviado").css("color","lime");
}
});
</script>

</body>
